<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="1" stop-color="#060a11"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".22" r=".75">
      <stop offset="0" stop-color="#22c7e8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22c7e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".9" cy=".95" r=".6">
      <stop offset="0" stop-color="#ff9f5a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe0f7"/>
      <stop offset=".55" stop-color="#22c7e8"/>
      <stop offset="1" stop-color="#ff9f5a"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2c45"/>
      <stop offset="1" stop-color="#0d1828"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (the favicon wraps this in a rounded clip) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>
  <!-- chip pins -->
  <g stroke="url(#edge)" stroke-width="18" stroke-linecap="round">
    <path d="M186 96v40M256 96v40M326 96v40M186 376v40M256 376v40M326 376v40M96 186h40M96 256h40M96 326h40M376 186h40M376 256h40M376 326h40"/>
  </g>
  <!-- chip body -->
  <rect x="130" y="130" width="252" height="252" rx="40" fill="url(#die)" stroke="url(#edge)" stroke-width="16"/>
  <!-- server blades with status LEDs -->
  <g>
    <rect x="178" y="184" width="156" height="36" rx="10" fill="#22c7e8"/>
    <rect x="178" y="238" width="156" height="36" rx="10" fill="#22c7e8" opacity=".82"/>
    <rect x="178" y="292" width="156" height="36" rx="10" fill="#22c7e8" opacity=".64"/>
    <g fill="#ff9f5a">
      <circle cx="310" cy="202" r="8"/><circle cx="310" cy="256" r="8"/><circle cx="310" cy="310" r="8"/>
    </g>
    <g fill="#06121c" opacity=".55">
      <rect x="196" y="198" width="70" height="8" rx="4"/><rect x="196" y="252" width="70" height="8" rx="4"/><rect x="196" y="306" width="70" height="8" rx="4"/>
    </g>
  </g>
</svg>
